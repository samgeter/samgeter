<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Samgeter profile terminal</title>
  <desc id="desc">A terminal-inspired introduction for a frontend and product developer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09111f"/><stop offset="1" stop-color="#111b2f"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#25314a" stroke-width="1" opacity=".34"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="428" rx="18" fill="url(#bg)" stroke="#2a3853" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="54" rx="18" fill="#141f33"/>
  <path d="M1 54h1198" stroke="#2a3853"/>
  <circle cx="31" cy="28" r="6" fill="#fb7185"/><circle cx="53" cy="28" r="6" fill="#fbbf24"/><circle cx="75" cy="28" r="6" fill="#34d399"/>
  <text x="104" y="34" fill="#8da2c3" font-family="Consolas, monospace" font-size="15">samgeter@github — profile</text>
  <rect x="1" y="55" width="1198" height="374" fill="url(#grid)"/>
  <g transform="translate(70 102)" font-family="Consolas, monospace">
    <rect width="300" height="252" rx="14" fill="#0b1425" stroke="#263653"/>
    <text x="34" y="53" fill="#64748b" font-size="14">IDENTITY / 001</text>
    <text x="33" y="139" fill="url(#accent)" font-weight="700" font-size="78" letter-spacing="-7" filter="url(#glow)">SG</text>
    <path d="M34 161h231" stroke="#263653"/>
    <text x="34" y="195" fill="#d8e2f2" font-size="15">FRONTEND</text>
    <text x="34" y="222" fill="#d8e2f2" font-size="15">PRODUCT DEVELOPMENT</text>
  </g>
  <g transform="translate(430 101)" font-family="Consolas, monospace">
    <text x="0" y="21" fill="#2dd4bf" font-size="16">samgeter@github:~$</text>
    <text x="209" y="21" fill="#cbd5e1" font-size="16">./profile --status</text>
    <text x="0" y="83" fill="#f8fafc" font-size="48" font-weight="700" letter-spacing="3">SAMGETER</text>
    <rect x="0" y="106" width="620" height="2" fill="url(#accent)"/>
    <text x="0" y="151" fill="#9fb0c9" font-size="20">FRONTEND DEVELOPER  /  PRODUCT BUILDER</text>
    <text x="0" y="200" fill="#64748b" font-size="14">PRIMARY SYSTEMS</text>
    <text x="0" y="229" fill="#d8e2f2" font-size="16">REACT  ·  TYPESCRIPT  ·  MODERN WEB UI</text>
    <rect x="0" y="265" width="186" height="40" rx="20" fill="#102e31" stroke="#2dd4bf"/>
    <circle cx="24" cy="285" r="6" fill="#2dd4bf" filter="url(#glow)"/>
    <text x="42" y="291" fill="#5eead4" font-size="14">SYSTEM ONLINE</text>
  </g>
</svg>
