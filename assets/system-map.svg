<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="469" viewBox="0 0 1200 469" role="img" aria-labelledby="title desc">
<title id="title">How I build</title>
<desc id="desc">Four stages, in order. Frame the workflow, design the system, build and evaluate, ship and iterate.</desc>
<defs>
  <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M0 54V0h54" fill="none" stroke="#7692cb" stroke-opacity=".11"/></pattern>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#101727"/><stop offset=".62" stop-color="#080a0f"/></linearGradient>
  <linearGradient id="ink" x2="1" y2="0" gradientUnits="objectBoundingBox"><stop stop-color="#f5f7fb"/><stop offset=".62" stop-color="#9ab0ff"/><stop offset="1" stop-color="#c191ff"/></linearGradient>
  <radialGradient id="haze"><stop stop-color="#526ec7" stop-opacity=".30"/><stop offset="1" stop-color="#526ec7" stop-opacity="0"/></radialGradient>
  <clipPath id="bounds"><rect width="1200" height="469" rx="30"/></clipPath>
</defs>
<g clip-path="url(#bounds)">
<rect width="1200" height="469" fill="#080a0f"/>
<rect width="1200" height="469" fill="url(#panel)"/>
