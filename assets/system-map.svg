<text x="54" y="56" fill="#9ab0ff" font-family="ui-monospace, Consolas, monospace" font-size="19" letter-spacing="2.5">02 / HOW I BUILD</text>
<text x="54" y="109" fill="#f5f7fb" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="700">From workflow to production</text>
<rect x="54" y="150" width="538" height="117" rx="18" fill="#111723" stroke="#283345"/><circle cx="99" cy="193" r="24" fill="#1a2643" stroke="#394d7a"/>
<text x="99" y="199" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#9ab0ff">01</text>
<text x="142" y="200" fill="#f5f7fb" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Frame the workflow</text><text x="142" y="233" fill="#a7afbf" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500">Users, friction, success</text>
<rect x="608" y="150" width="538" height="117" rx="18" fill="#111723" stroke="#283345"/><circle cx="653" cy="193" r="24" fill="#1a2643" stroke="#394d7a"/>
<text x="653" y="199" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#9ab0ff">02</text>
<text x="696" y="200" fill="#f5f7fb" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Design the system</text><text x="696" y="233" fill="#a7afbf" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500">Data, roles, boundaries</text>
<rect x="54" y="288" width="538" height="117" rx="18" fill="#111723" stroke="#283345"/><circle cx="99" cy="331" r="24" fill="#1a2643" stroke="#394d7a"/>
<text x="99" y="337" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#9ab0ff">03</text>
<text x="142" y="338" fill="#f5f7fb" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Build and evaluate</text><text x="142" y="371" fill="#a7afbf" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500">Interfaces, AI outputs, tests</text>
<rect x="608" y="288" width="538" height="117" rx="18" fill="#111723" stroke="#283345"/><circle cx="653" cy="331" r="24" fill="#1a2643" stroke="#394d7a"/>
<text x="653" y="337" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#9ab0ff">04</text>
<text x="696" y="338" fill="#f5f7fb" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Ship and iterate</text><text x="696" y="371" fill="#a7afbf" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500">Deploy, observe, refine</text>
<text x="54" y="442" fill="#a7afbf" font-family="ui-monospace, Consolas, monospace" font-size="15" letter-spacing="2.5">REPEAT AS THE PRODUCT AND THE EVIDENCE CHANGE</text>
