      <text x="20" y="120" fill="#102F42" font-size="21" font-weight="800">DOSSIE</text><text x="20" y="144" fill="#102F42" font-size="21" font-weight="800">SCHOLAR</text>
      <text x="20" y="174" fill="#F15B3C" font-size="12" font-weight="700">RESEARCH KNOWLEDGE</text>
      <text x="20" y="207" fill="#52646C" font-size="14">OCR, retrieval and</text><text x="20" y="230" fill="#52646C" font-size="14">searchable research.</text>
      <path d="M20 253h166" stroke="#D5CCBF"/><text x="20" y="271" fill="#7A878B" font-size="11">AI + DATA PIPELINES</text>
