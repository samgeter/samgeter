      <rect x="0" y="78" width="206" height="205" rx="12" fill="#F4EFE6"/>
      <text x="20" y="120" fill="#102F42" font-size="23" font-weight="800">YUBA</text>
      <text x="20" y="151" fill="#F15B3C" font-size="12" font-weight="700">VENTURE BUILDING</text>
      <text x="20" y="187" fill="#52646C" font-size="14">Founder journeys,</text><text x="20" y="210" fill="#52646C" font-size="14">portfolios and</text><text x="20" y="233" fill="#52646C" font-size="14">venture validation.</text>
      <path d="M20 253h166" stroke="#D5CCBF"/><text x="20" y="271" fill="#7A878B" font-size="11">PRODUCT LEAD + ENGINEERING</text>
    </g>
    <g transform="translate(282 180)">
