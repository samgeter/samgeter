      <text x="20" y="120" fill="#F4EFE6" font-size="23" font-weight="800">MENTEL</text>
      <text x="20" y="151" fill="#55C2B3" font-size="12" font-weight="700">PRIVATE PRODUCT</text>
      <text x="20" y="187" fill="#B8C7CE" font-size="14">Product and technical</text><text x="20" y="210" fill="#B8C7CE" font-size="14">case study available</text><text x="20" y="233" fill="#B8C7CE" font-size="14">on request.</text>
      <path d="M20 253h166" stroke="#496273"/><text x="20" y="271" fill="#78909B" font-size="11">SOURCE RESTRICTED</text>
