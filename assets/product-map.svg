      <text x="20" y="151" fill="#F15B3C" font-size="12" font-weight="700">PRIVATE PRODUCT</text>
      <text x="20" y="187" fill="#52646C" font-size="14">Product and technical</text><text x="20" y="210" fill="#52646C" font-size="14">case study available</text><text x="20" y="233" fill="#52646C" font-size="14">on request.</text>
      <path d="M20 253h142" stroke="#D5CCBF"/><text x="20" y="271" fill="#7A878B" font-size="11">SOURCE RESTRICTED</text>
