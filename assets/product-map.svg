<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Samuel's selected product systems</title>
  <desc id="desc">Yuba, Apptus, DossieScholar, Mentel, and Zeb.</desc>
  <rect width="1200" height="540" rx="20" fill="#102F42"/>
  <g font-family="Arial, Helvetica, sans-serif">
