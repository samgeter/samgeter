      <rect x="0" y="78" width="206" height="205" rx="12" fill="#173E55" stroke="#496273"/>
      <text x="20" y="120" fill="#F4EFE6" font-size="23" font-weight="800">APPTUS</text>
      <text x="20" y="151" fill="#55C2B3" font-size="12" font-weight="700">PROGRAM OPERATIONS</text>
      <text x="20" y="187" fill="#B8C7CE" font-size="14">Founder discovery,</text><text x="20" y="210" fill="#B8C7CE" font-size="14">applications and</text><text x="20" y="233" fill="#B8C7CE" font-size="14">rubric-led selection.</text>
      <path d="M20 253h166" stroke="#496273"/><text x="20" y="271" fill="#78909B" font-size="11">SAAS + WORKFLOWS</text>
